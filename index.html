<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Our Story</title>
  <meta name="description" content="The journey of how we became a family.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>❤️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="style.css?v=4">
</head>
<body>
  <div id="map" aria-label="Map of our journey"></div>

  <section id="intro" class="intro">
    <div class="intro-card">
      <p class="eyebrow">Happy Birthday, Sarah</p>
      <h1>Our Story</h1>
      <p class="intro-sub">I'll follow you across all the seven seas,<br>
      Wherever you go, that's where I'll be.</p>
      <button id="start" class="btn btn-primary">Begin the journey</button>
    </div>
  </section>

  <div id="caption" class="caption" hidden>
    <span id="caption-date"></span>
    <span id="caption-place"></span>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modal-label">
    <button class="modal-close" id="modal-close" aria-label="Close">×</button>
    <div class="carousel">
      <div class="carousel-frame">
        <img id="photo" alt="">
        <button class="nav prev" id="photo-prev" aria-label="Previous photo">‹</button>
        <button class="nav next" id="photo-next" aria-label="Next photo">›</button>
        <span class="counter" id="photo-count"></span>
      </div>
      <div class="thumbs" id="thumbs"></div>
    </div>
    <div class="modal-body">
      <p class="modal-meta"><span id="modal-date"></span> · <span id="modal-place"></span></p>
      <h2 id="modal-label"></h2>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="back">← Back</button>
        <button class="btn btn-primary" id="next">Continue →</button>
      </div>
    </div>
  </dialog>

  <button id="resume" class="btn btn-primary resume" hidden>Continue →</button>

  <nav class="timeline" id="timeline" aria-label="Timeline"></nav>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
